name: Build climate data

# Manual retrigger: 2026-08-18
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "precompute_climate.py"
      - "precompute_climate_safe.py"
      - "city_catalog.py"
      - "city_catalog_generated.py"
      - ".github/workflows/build-climate-data.yml"
  schedule:
    - cron: "20 4 10 1 *"

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: python -m pip install --upgrade pandas "meteostat>=2.1.4" "geonamescache>=2.0.0"

      - name: Precompute validated 10-year climate data
        run: python precompute_climate_safe.py

      - name: Validate generated database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('data/climate_metadata.json').read_text(encoding='utf-8'))
          ratio = float(meta.get('success_ratio', 0))
          cities = int(meta.get('cities_with_data', 0))
          total = int(meta.get('cities_catalog', 0))
          print(f'Validated database: {cities}/{total} cities ({ratio:.1%})')
          if ratio < 0.80:
              raise SystemExit('Refusing to publish incomplete climate database')
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/climate_10y.csv data/climate_metadata.json
          if git diff --cached --quiet; then
            echo "No climate-data changes"
          else
            git commit -m "Update validated precomputed climate data"
            git push
          fi
